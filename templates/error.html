<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .title}}{{.title}}{{else}}BREACH::HARBOR{{end}}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-card text-center">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>

            <h2 class="auth-brand mb-4">BREACH::HARBOR</h2>

            <div class="mb-3">
                <i class="fas fa-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
            </div>

            <h1 class="h2 fw-bold mb-3">Something went wrong</h1>

            {{if .error}}
            <div class="alert alert-danger d-inline-block text-start">
                <i class="fas fa-info-circle me-2"></i>{{.error}}
            </div>
            {{else}}
            <p class="text-muted mb-4">An unexpected error occurred. Please try again.</p>
            {{end}}

            <div class="mt-4 d-flex gap-2 justify-content-center flex-wrap">
                <a href="/dashboard" class="btn btn-primary">
                    <i class="fas fa-home me-2"></i>Go to Dashboard
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>

    <div id="alerts" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
        <!-- Alerts will be inserted here by HTMX -->
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
